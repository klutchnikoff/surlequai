name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter and Android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/setup-flutter
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Static analysis
        run: flutter analyze --no-pub --fatal-infos
      - name: Flutter tests
        run: flutter test --no-pub
      - name: Android compilation (no release signing)
        run: flutter build apk --debug --no-pub

  proxy:
    name: Proxy and release checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Proxy tests (mocked network)
        working-directory: cloudflare-worker
        run: npm test
      - name: Release validation tests
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
