name: Flutter SDK
description: Install the repository's pinned Flutter SDK and locked dependencies
runs:
  using: composite
  steps:
    - name: Read Flutter version
      id: version
      shell: bash
      run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        flutter-version: ${{ steps.version.outputs.version }}
        channel: stable
        cache: true
    - name: Install locked dependencies
      shell: bash
      run: flutter pub get --enforce-lockfile
