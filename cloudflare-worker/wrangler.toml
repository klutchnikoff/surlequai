name = "surlequai"
main = "worker.js"
compatibility_date = "2026-09-08"

# Limiteur natif Cloudflare : pas de compteur get/put KV ni de TTL renouvelé.
# namespace_id doit être réservé à SurLeQuai dans ce compte.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 100, period = 60 }

# Remplace le compteur KV : une écriture par requête sans quota d'écritures ni
# lecture-modification-écriture concurrente. Le namespace KV d29ca273 n'est plus
# utilisé et peut être supprimé une fois cette version déployée.
[[analytics_engine_datasets]]
binding = "STATS"
dataset = "surlequai_requests"

# Secret inchangé : wrangler secret put NAVITIA_API_KEY
[observability]
enabled = false
